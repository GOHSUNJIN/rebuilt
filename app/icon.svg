<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background -->
  <rect width="100" height="100" fill="#0b0c0e"/>

  <!-- Circle ring with gap at ~4 o'clock (lower-right), matching the logo mark -->
  <path d="M83 78 A43 43 0 1 1 90 65"
    fill="none" stroke="white" stroke-width="5" stroke-linecap="round"/>

  <!-- R — left stem -->
  <rect x="23" y="24" width="9" height="53" fill="white"/>

  <!-- R — bowl outer (D-shape arch on right) -->
  <path d="M32 24 L54 24 C67 24 67 51 54 51 L32 51 Z" fill="white"/>

  <!-- R — bowl inner cutout (hollow centre) -->
  <path d="M32 31 L52 31 C61 31 61 44 52 44 L32 44 Z" fill="#0b0c0e"/>

  <!-- R — diagonal leg going lower-right -->
  <polygon points="32,51 46,51 65,77 51,77" fill="white"/>

  <!-- R — angular notch cut at bowl-leg junction (the distinctive slash) -->
  <polygon points="32,51 44,51 36,62" fill="#0b0c0e"/>
</svg>
